apiVersion: apps/v1
kind: Deployment
metadata:
  name: laravel-app
  namespace: laravel
spec:
  replicas: 2
  selector:
    matchLabels: { app: laravel }
  template:
    metadata:
      labels: { app: laravel }
    spec:
      initContainers:
      - name: migrate
        image: IMAGE_PLACEHOLDER
        command: ["sh","-c","until php -r 'new PDO(\"mysql:host=mysql;dbname=laravel\",\"laravel\",getenv(\"DB_PASSWORD\"));' 2>/dev/null; do echo waiting for db; sleep 3; done; php artisan migrate --force"]
        envFrom:
        - secretRef: { name: laravel-secret }
        env:
        - { name: DB_CONNECTION, value: mysql }
        - { name: DB_HOST, value: mysql }
        - { name: DB_PORT, value: "3306" }
        - { name: DB_DATABASE, value: laravel }
        - { name: DB_USERNAME, value: laravel }
      containers:
      - name: laravel
        image: IMAGE_PLACEHOLDER
        ports:
        - containerPort: 80
        envFrom:
        - secretRef: { name: laravel-secret }
        env:
        - { name: APP_ENV, value: production }
        - { name: DB_CONNECTION, value: mysql }
        - { name: DB_HOST, value: mysql }
        - { name: DB_PORT, value: "3306" }
        - { name: DB_DATABASE, value: laravel }
        - { name: DB_USERNAME, value: laravel }
---
apiVersion: v1
kind: Service
metadata:
  name: laravel-svc
  namespace: laravel
spec:
  type: NodePort
  selector: { app: laravel }
  ports:
  - port: 80
    targetPort: 80
    nodePort: 30080
